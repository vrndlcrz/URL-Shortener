<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shortly – free link shortener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7ff;--ink:#0b1b3a;--muted:#5a6a8c;--field:#fff;--line:#d3dffb;--brand:#2f6bff;--brand-ink:#fff;--ok:#12805c;--shadow:rgba(47,107,255,.16);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0a1122;--ink:#eaf0ff;--muted:#93a3c7;--field:#121b33;--line:#24335a;--brand:#6c93ff;--brand-ink:#0a1122;--ok:#4ad8a3;--shadow:rgba(0,0,0,.4);}
}
:root[data-theme="dark"]{--bg:#0a1122;--ink:#eaf0ff;--muted:#93a3c7;--field:#121b33;--line:#24335a;--brand:#6c93ff;--brand-ink:#0a1122;--ok:#4ad8a3;--shadow:rgba(0,0,0,.4);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
header{max-width:1040px;margin:0 auto;padding:22px 24px}
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--brand-ink);font-style:normal;font-size:17px}
main{max-width:760px;margin:0 auto;padding:9vh 20px 64px;text-align:center}
h1{font-size:clamp(38px,7.2vw,64px);line-height:1.05;letter-spacing:-.035em;font-weight:800;margin:0 0 16px}
.sub{max-width:44ch;margin:0 auto 40px;color:var(--muted);font-size:18px}

.grp{
  --e:cubic-bezier(.65,0,.2,1);
  display:flex;align-items:center;margin:0 auto;width:100%;max-width:720px;height:68px;padding:6px;
  background:var(--field);border:2px solid var(--line);border-radius:999px;box-shadow:0 8px 28px var(--shadow);
  transition:width .9s var(--e),height .9s var(--e),padding .9s var(--e),border-color .2s;
}
.grp:focus-within{border-color:var(--brand)}
.grp.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#url{
  flex:1;min-width:0;height:100%;padding:0 22px;border:0;outline:0;background:transparent;color:var(--ink);
  font:600 18px/1 Manrope,system-ui,sans-serif;text-overflow:ellipsis;transition:font-size .9s var(--e),padding .9s var(--e);
}
#url::placeholder{color:var(--muted);opacity:.75}
.btn{
  flex:none;height:100%;padding:0 30px;border:0;border-radius:999px;background:var(--brand);color:var(--brand-ink);cursor:pointer;
  font:800 17px/1 Manrope,system-ui,sans-serif;transition:font-size .9s var(--e),padding .9s var(--e),filter .15s;
}
.btn:hover{filter:brightness(1.07)}
.btn:focus-visible,.again:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.grp.short{height:42px;padding:4px}
.grp.short #url{font-size:12.5px;padding:0 14px}
.grp.short .btn{font-size:12.5px;padding:0 18px}

#msg{min-height:26px;margin:20px 0 0;color:var(--muted);font-size:15px}
#msg.ok{color:var(--ok);font-weight:600}
#msg.err{color:#d64545}
.again{margin-top:10px;font:600 15px/1 Manrope,sans-serif;color:var(--brand);background:none;border:0;padding:6px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.note{margin:36px 0 0;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){.grp,#url,.btn{transition-duration:.01s}.grp.shake{animation:none}}
@media (max-width:520px){.btn{padding:0 20px;font-size:16px}#url{padding:0 16px;font-size:16px}}
</style>
</head>
<body>
<header><span class="logo"><i>s</i>shortly</span></header>
<main>
  <h1>Shorten your link</h1>
  <p class="sub">Paste a long URL and get a short one you can share anywhere.</p>

  <div class="grp" id="grp">
    <input id="url" type="text" inputmode="url" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Paste your long link here" aria-label="Long link">
    <button class="btn" id="btn" type="button">Shorten</button>
  </div>
  <p id="msg" role="status"></p>
  <button class="again" id="again" type="button" hidden>Shorten another</button>

  <p class="note">Free to use. No sign-up needed.</p>
</main>

<script>
(()=>{
const $=id=>document.getElementById(id);
const grp=$("grp"),url=$("url"),btn=$("btn"),msg=$("msg"),again=$("again");
const OK=/^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(:\d+)?([\/?#]\S*)?$/i;
let done=false,t1=0,t2=0;

function say(t,c){msg.textContent=t;msg.className=c||""}
function shake(){grp.classList.remove("shake");void grp.offsetWidth;grp.classList.add("shake")}
function full(){return Math.min(720,grp.parentElement.clientWidth)}

function shorten(){
  let v=url.value.trim();
  if(!v||!OK.test(v)){say(v?"That doesn’t look like a link. Check it and try again.":"Paste a link to get started.","err");shake();url.focus();return}
  if(!/^https?:\/\//i.test(v)){v="https://"+v;url.value=v}
  const w=grp.offsetWidth;
  grp.style.width=w+"px";void grp.offsetWidth;
  grp.classList.add("short");
  grp.style.width=Math.round(Math.max(230,Math.min(340,w*.55)))+"px";
  url.readOnly=true;url.title=v;url.blur();btn.disabled=true;say("");
  t1=setTimeout(()=>{btn.textContent="Copy";btn.disabled=false},450);
  t2=setTimeout(()=>{say("Your short link is ready.","ok");again.hidden=false;done=true},950);
}
async function copy(){
  try{await navigator.clipboard.writeText(url.value)}
  catch(e){url.readOnly=false;url.select();document.execCommand&&document.execCommand("copy");url.readOnly=true}
  btn.textContent="Copied";say("Copied to clipboard.","ok");
  setTimeout(()=>{if(done)btn.textContent="Copy"},1600);
}
function reset(){
  clearTimeout(t1);clearTimeout(t2);done=false;again.hidden=true;say("");
  grp.style.width=grp.offsetWidth+"px";void grp.offsetWidth;
  grp.classList.remove("short");grp.style.width=full()+"px";
  btn.textContent="Shorten";btn.disabled=false;url.readOnly=false;url.removeAttribute("title");url.value="";
  setTimeout(()=>{if(!done){grp.style.width="";url.focus()}},950);
}
btn.addEventListener("click",()=>done?copy():shorten());
url.addEventListener("keydown",e=>{if(e.key==="Enter"&&!done)shorten()});
again.addEventListener("click",reset);
})();
</script>
</body>
</html>
